# ABFRL Agentic Commerce - Local / staging deployment
# Run from repo root: docker-compose -f infra/docker/docker-compose.yml up -d

version: "3.8"

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - FRONTEND_URL=http://localhost:5173,http://localhost:3000
      - DEMO_MODE=true
    volumes:
      # Persist file-backed data
      - backend-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: PostgreSQL for WhatsApp sessions / customers (uncomment when using DB)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: retail_agent_system
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  backend-data:
  # postgres-data:
